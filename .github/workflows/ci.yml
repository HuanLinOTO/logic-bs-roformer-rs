name: build-and-test

# GitHub 托管 runner（ubuntu-24.04，无 GPU）：验证 fresh checkout 可编译。
# GPU 步骤（self-test / SNR 门槛）为探测式：将来接到带 GPU 的 runner
# 自动生效。为省配额只跑最新一次（cancel-in-progress）。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUDA_HOME: /usr/local/cuda-13.3
      # bootstrap (rustc-codegen-cuda, dev profile) 去掉 debuginfo：11G -> ~4G
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space (drop preinstalled toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Vendor overlay (cuda-oxide-codegen src/target)
        run: |
          mkdir -p vendor/cuda-rust/cuda-oxide/crates/cuda-oxide-codegen/src
          cp -r vendor-overlay/cuda-oxide-codegen/src/target \
                vendor/cuda-rust/cuda-oxide/crates/cuda-oxide-codegen/src/

      - name: Install CUDA 13.3 toolkit (network repo)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-toolkit-13-3 > /dev/null
          "$CUDA_HOME/bin/nvcc" --version | tail -2

      - name: Install libclang (bindgen)
        run: sudo apt-get install -y -qq libclang-dev > /dev/null

      - name: Build (cargo oxide, release)
        run: |
          export PATH="$HOME/.cargo/bin:${CUDA_HOME}/bin:${PATH}"
          export LIBCLANG_PATH=/usr/lib/llvm-18/lib
          cargo oxide build -- --release

      - name: Upload lbrr binary
        uses: actions/upload-artifact@v4
        with:
          name: lbrr-linux-x64
          path: target/release/lbrr
          if-no-files-found: error
          retention-days: 14

      - name: GPU self-test & golden SNR gate (GPU runners only)
        run: |
          if [ ! -e /dev/nvidia0 ]; then
            echo 'no GPU on this runner — skipping GPU validation'
            exit 0
          fi
          ./target/release/lbrr --self-test
          if [ -d /opt/lbrr-assets ]; then
            mkdir -p assets && cp -rn /opt/lbrr-assets/. assets/
            ./target/release/lbrr --bench --iters 1 --model-dir assets | tee bench.log
            snr=$(grep -oP 'BENCH final SNR vs ref_output: \K[0-9.]+' bench.log)
            test -n "$snr" && awk -v s="$snr" 'BEGIN { if (s+0 < 60) { printf "FAIL: SNR %s < 60\n", s; exit 1 } else printf "PASS: SNR %s >= 60\n", s }'
          fi
  build-windows:
    name: windows-latest MSVC no-GPU canary
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.2.0"
          method: local

      - name: Configure Windows CUDA and libclang paths
        shell: pwsh
        run: |
          $cudaPath = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}"
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_HOME=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDA_TOOLKIT_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIB=$cudaPath\lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INCLUDE=$cudaPath\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          if (Test-Path "$cudaPath\bin\x64") {
            "$cudaPath\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmBin) {
            "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
            $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Install libffi (cuda-bindings link)
        shell: pwsh
        run: vendor/cuda-rust/.github/scripts/install-libffi.ps1
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg

      - name: Build (cargo oxide, release)
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo oxide build -- --release

      - name: Upload lbrr binary
        uses: actions/upload-artifact@v4
        with:
          name: lbrr-win-x64
          path: target/release/lbrr.exe
          if-no-files-found: error
          retention-days: 14
