[package]
name = "lbrr"
version = "0.1.0"
edition = "2024"
description = "BS-RoFormer six-stem music separation — pure Rust + cuda-oxide GPU inference"

# Standalone crate. `vendor/` holds an embedded cuda-rust checkout whose
# crates belong to their own nested workspaces — exclude it so cargo does not
# try to bind their `*.workspace = true` inheritance to this manifest.
[workspace]
exclude = ["vendor"]

[dependencies]
# Device-side intrinsics (thread indexing, barriers, shared memory, ...)
cuda-device = { path = "vendor/cuda-rust/cuda-oxide/crates/cuda-device" }
# Host-side kernel-loading helpers generated by #[cuda_module]
cuda-host = { path = "vendor/cuda-rust/cuda-oxide/crates/cuda-host" }
# Host-side CUDA runtime (context, streams, DeviceBuffer, launches)
cuda-core = { path = "vendor/cuda-rust/cuda-core" }

# dlopen helper for the cuFFT runtime bindings (already in the vendor graph)
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
